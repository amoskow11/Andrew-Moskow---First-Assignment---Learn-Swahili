<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swahili Skill Sprint</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <header class="top-bar">
      <h1>Swahili Skill Sprint</h1>
      <p class="subtitle">Learn Swahili through fun daily practice</p>
    </header>

    <main id="quiz-screen" class="quiz-card">
      <section class="stats-section">
        <div class="stat-box">
          <span class="stat-label">Score</span>
          <span id="score">0</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">Streak</span>
          <span id="streak">0</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">Longest</span>
          <span id="longest-streak">0</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">Session XP</span>
          <span id="session-xp">0</span>
        </div>
      </section>

      <section class="progress-section">
        <div class="stat-box small">
          <span class="stat-label">Total XP</span>
          <span id="total-xp">0</span>
        </div>
        <div class="stat-box small">
          <span class="stat-label">Lessons Completed</span>
          <span id="lessons-completed">0</span>
        </div>
      </section>

      <section class="question-section">
        <p id="question-number">Question 1 of 30</p>
        <h2 id="question-text">Loading question...</h2>
      </section>

      <section class="answer-section">
        <input
          type="text"
          id="answer-input"
          placeholder="Type your answer here"
          autocomplete="off"
        />
        <div class="button-row">
          <button id="submit-btn">Submit Answer</button>
          <button id="next-btn" class="hidden">Next Question</button>
        </div>
      </section>

      <section class="feedback-section">
        <p id="feedback-message"></p>
      </section>
    </main>

    <section id="results-screen" class="results-card hidden">
      <h2>Lesson Complete!</h2>
      <p><strong>Final Score:</strong> <span id="final-score">0</span></p>
      <p><strong>Longest Streak:</strong> <span id="final-longest-streak">0</span></p>
      <p><strong>XP Earned This Session:</strong> <span id="final-session-xp">0</span></p>
      <p><strong>Total XP:</strong> <span id="final-total-xp">0</span></p>
      <p><strong>Lessons Completed:</strong> <span id="final-lessons-completed">0</span></p>
      <button id="restart-btn">Play Again</button>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
