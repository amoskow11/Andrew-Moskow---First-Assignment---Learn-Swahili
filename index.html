<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swahili Sprint</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <div class="app-card">
      <header class="topbar">
        <div class="brand">
          <div class="brand-icon">🦒</div>
          <div>
            <h1>Swahili Sprint</h1>
            <p>Playful beginner practice</p>
          </div>
        </div>

        <div class="stats">
          <div class="stat">
            <span class="stat-label">Score</span>
            <span class="stat-value" id="score">0/10</span>
          </div>
          <div class="stat">
            <span class="stat-label">Streak</span>
            <span class="stat-value" id="streak">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Session XP</span>
            <span class="stat-value" id="sessionXP">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Total XP</span>
            <span class="stat-value" id="totalXP">0</span>
          </div>
        </div>
      </header>

      <main class="content">
        <section id="quizArea">
          <div class="progress-wrap">
            <div class="progress-topline">
              <span class="badge" id="modeBadge">🌟 Classic Round</span>
              <span class="question-count" id="questionCount">Question 1 of 10</span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" id="progressFill"></div>
            </div>
          </div>

          <div class="question-card">
            <h2 class="question-text" id="questionText"></h2>
            <div class="choices" id="choices"></div>
            <div class="feedback" id="feedback"></div>
          </div>
        </section>

        <section class="results" id="results">
          <div class="results-emoji">🎉</div>
          <h2>Session Complete!</h2>
          <p class="results-subtitle">You finished your Swahili practice round.</p>

          <div class="results-grid">
            <div class="result-card">
              <h3>Final Score</h3>
              <p id="finalScore">0/10</p>
            </div>
            <div class="result-card">
              <h3>Longest Streak</h3>
              <p id="finalStreak">0</p>
            </div>
            <div class="result-card">
              <h3>Session XP</h3>
              <p id="finalXP">0</p>
            </div>
            <div class="result-card">
              <h3>Lessons Completed</h3>
              <p id="finalLessons">0</p>
            </div>
          </div>

          <p class="tiny-note" id="savedXPNote"></p>
          <button class="restart-btn" id="restartBtn">Play Again</button>
        </section>
      </main>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
