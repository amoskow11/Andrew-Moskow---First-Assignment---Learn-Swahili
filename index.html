<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swahili Sprint</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>Swahili Sprint</h1>
      <p class="subtitle">A playful beginner Swahili practice app</p>
    </header>

    <section class="stats">
      <div class="stat-card">
        <span class="label">Score</span>
        <span id="score">0</span>
      </div>
      <div class="stat-card">
        <span class="label">Streak</span>
        <span id="streak">0</span>
      </div>
      <div class="stat-card">
        <span class="label">Session XP</span>
        <span id="sessionXP">0</span>
      </div>
      <div class="stat-card">
        <span class="label">Total XP</span>
        <span id="totalXP">0</span>
      </div>
      <div class="stat-card">
        <span class="label">Lessons Completed</span>
        <span id="lessonsCompleted">0</span>
      </div>
    </section>

    <main class="quiz-container" id="quizContainer">
      <div class="question-meta">
        <span id="questionCount">Question 1 of 10</span>
        <span id="roundType" class="round-type">Classic Round</span>
      </div>

      <h2 id="questionText">Loading question...</h2>

      <div id="choicesContainer" class="choices"></div>

      <div id="feedback" class="feedback"></div>

      <button id="nextBtn" class="next-btn hidden">Next Question</button>
    </main>

    <section id="resultsScreen" class="results hidden">
      <h2>Session Complete 🎉</h2>
      <p id="finalScore"></p>
      <p id="finalLongestStreak"></p>
      <p id="finalSessionXP"></p>
      <p id="finalTotalXP"></p>
      <p id="finalLessonsCompleted"></p>
      <button id="restartBtn">Play Again</button>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
