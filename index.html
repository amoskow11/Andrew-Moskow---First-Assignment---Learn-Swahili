<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learn Swahili 🌍</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>🌍 Learn Swahili</h1>
    <div id="stats-bar">
      <span id="stat-score">Score: 0</span>
      <span id="stat-streak">🔥 Streak: 0</span>
      <span id="stat-xp">⭐ XP: 0</span>
      <span id="stat-total-xp">💾 Total XP: 0</span>
      <span id="stat-lessons">📚 Lessons: 0</span>
    </div>
  </header>

  <main>
    <div id="quiz-container">

      <div id="progress-bar-wrapper">
        <div id="progress-bar"></div>
      </div>

      <p id="question-counter">Question 1 of 10</p>

      <div id="question-card">
        <p id="question-prompt"></p>
        <div id="choices-container"></div>
        <div id="type-answer-container" class="hidden">
          <input type="text" id="type-input" placeholder="Type your answer here..." autocomplete="off" />
          <button id="submit-btn">Submit</button>
        </div>
      </div>

      <div id="feedback-box" class="hidden">
        <p id="feedback-text"></p>
        <button id="next-btn">Next →</button>
      </div>

    </div>

    <div id="results-screen" class="hidden">
      <h2>🎉 Session Complete!</h2>
      <p id="results-score"></p>
      <p id="results-xp"></p>
      <p id="results-streak"></p>
      <p id="results-total-xp"></p>
      <p id="results-lessons"></p>
      <button id="play-again-btn">Play Again 🔄</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
